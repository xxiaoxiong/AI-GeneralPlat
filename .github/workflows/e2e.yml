name: E2E (真实模型)

# Phase 2.1 §17：真实模型 E2E 与 Secret 配置分开。
# - 需要在仓库 Secrets 配置 AGENT_E2E_BASE_URL / AGENT_E2E_API_KEY / AGENT_E2E_MODEL；
# - 未配置时测试自身显式 skip（不会计入基础 CI 通过/失败）；
# - 仅手动触发，避免真实模型的不确定性影响基础 CI。

on:
  workflow_dispatch:

jobs:
  e2e-real-model:
    name: 真实模型 E2E（需 Secret）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装锁定依赖
        run: pip install -r backend/requirements.txt
      - name: 真实模型 E2E（未配置 Secret 时显式 skipped）
        working-directory: backend
        env:
          PYTHONPATH: "."
          PYTHONIOENCODING: utf-8
          SECRET_KEY: test-secret-key-for-ci
          AGENT_E2E_BASE_URL: ${{ secrets.AGENT_E2E_BASE_URL }}
          AGENT_E2E_API_KEY: ${{ secrets.AGENT_E2E_API_KEY }}
          AGENT_E2E_MODEL: ${{ secrets.AGENT_E2E_MODEL }}
        run: pytest tests/test_agent_runtime_e2e.py -q -rs --tb=short -p no:cacheprovider
