name: ai-generalplat

services:
  mysql:
    image: mysql:8.0
    container_name: ai_plat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ai_plat
      MYSQL_USER: ai_plat
      MYSQL_PASSWORD: 123456
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_plat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL Checkpointer（Durable Execution）：多 Uvicorn Worker / 多容器
  # 共享 Graph State 的持久化后端（P0-01）。宿主机映射 5433 供集成测试直连。
  checkpoint_pg:
    image: postgres:16-alpine
    container_name: ai_plat_checkpoint_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_cp
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: agent_checkpoints
    ports:
      - "5433:5432"
    volumes:
      - checkpoint_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_cp -d agent_checkpoints"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # 构建上下文为仓库根目录，docker/ 目录集中存放部署文件
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        # pip 镜像加速（可改为 https://pypi.org/simple 或本地镜像）
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    container_name: ai_plat_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+aiomysql://ai_plat:123456@mysql:3306/ai_plat
      DATABASE_SYNC_URL: mysql+pymysql://ai_plat:123456@mysql:3306/ai_plat
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production-please-use-a-long-random-key
      DEBUG: "false"
      UPLOAD_DIR: /app/data/uploads
      CHROMA_PERSIST_DIR: /app/data/chroma
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin@123456
      ADMIN_USERNAME: admin
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80"]'
      # Durable Execution：多 Worker 共享 PostgreSQL Checkpointer（禁止 memory）
      AGENT_RUNTIME_ENABLED: "true"
      AGENT_CHECKPOINT_DSN: postgresql://ai_cp:123456@checkpoint_pg:5432/agent_checkpoints
      UVICORN_WORKERS: "2"
    volumes:
      - app_data:/app/data
      - ../log:/app/data/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      checkpoint_pg:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: ai_plat_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  app_data:
  checkpoint_pg_data:
